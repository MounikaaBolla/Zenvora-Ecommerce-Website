<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Zenvora - Add Product</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #F7F5EF;
            color: #1F2933;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            height: 70px;

            background: #0F3D3E;

            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 50px;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .back-btn {
            text-decoration: none;

            color: white;

            background: #D4A017;

            padding: 10px 18px;

            border-radius: 8px;

            font-weight: bold;
        }

        .back-btn:hover {
            background: #B8860B;
        }

        /* ================= MAIN ================= */

        .container {
            max-width: 700px;

            margin: 50px auto;

            padding: 0 20px;
        }

        .form-box {
            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 5px 18px rgba(0,0,0,0.08);
        }

        .title {
            text-align: center;

            color: #0F3D3E;

            font-size: 30px;

            margin-bottom: 35px;
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #0F3D3E;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #D1D5DB;

            border-radius: 8px;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            border-color: #0F3D3E;

            box-shadow:
                0 0 0 2px rgba(15,61,62,0.1);
        }

        /* ================= IMAGE UPLOAD ================= */

        .image-upload {
            border: 2px dashed #0F3D3E;

            border-radius: 10px;

            padding: 25px;

            text-align: center;

            background: #F8FAF9;
        }

        .image-icon {
            font-size: 45px;

            margin-bottom: 10px;
        }

        .image-upload p {
            color: #666;

            margin-bottom: 15px;
        }

        .image-upload input {
            border: none;

            padding: 5px;

            background: transparent;
        }

        /* ================= BUTTON ================= */

        .add-btn {
            width: 100%;

            margin-top: 10px;

            padding: 15px;

            border: none;

            border-radius: 8px;

            background: #D4A017;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        .add-btn:hover {
            background: #B8860B;
        }

        /* ================= FOOTER ================= */

        footer {
            margin-top: 70px;

            background: #0F3D3E;

            color: white;

            text-align: center;

            padding: 30px;
        }

        footer p {
            margin: 6px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            .navbar {
                padding: 0 20px;
            }

            .logo {
                font-size: 21px;
            }

            .form-box {
                padding: 25px;
            }

            .title {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="logo">
        🛒 Zenvora Admin
    </div>

    <a href="/admin"
       class="back-btn">

        ← Dashboard

    </a>

</nav>


<!-- ================= MAIN ================= -->

<main class="container">

    <div class="form-box">

        <h1 class="title">

            ➕ Add New Product

        </h1>


        <!-- ================= FORM ================= -->

        <form
            action="/admin/products/add"
            method="post"
            enctype="multipart/form-data">


            <!-- PRODUCT NAME -->

            <div class="form-group">

                <label for="productName">

                    Product Name

                </label>

                <input
                    type="text"
                    id="productName"
                    name="productName"
                    placeholder="Enter product name"
                    required>

            </div>


            <!-- PRICE -->

            <div class="form-group">

                <label for="price">

                    Price (₹)

                </label>

                <input
                    type="number"
                    id="price"
                    name="price"
                    step="0.01"
                    min="0"
                    placeholder="Enter price"
                    required>

            </div>


            <!-- QUANTITY -->

            <div class="form-group">

                <label for="quantity">

                    Stock Quantity

                </label>

                <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    min="0"
                    placeholder="Enter stock quantity"
                    required>

            </div>


            <!-- CATEGORY -->

            <div class="form-group">

                <label for="categoryId">

                    Category ID

                </label>

                <input
                    type="number"
                    id="categoryId"
                    name="categoryId"
                    min="1"
                    placeholder="Example: 1"
                    required>

            </div>


            <!-- ================= IMAGE ================= -->

            <div class="form-group">

                <label>

                    Product Image

                </label>


                <div class="image-upload">

                    <div class="image-icon">
                        📷
                    </div>

                    <p>
                        Choose an image for your product
                    </p>


                    <input
                        type="file"
                        id="image"
                        name="image"
                        accept="image/*"
                        required>

                </div>

            </div>


            <!-- ================= SUBMIT ================= -->

            <button
                type="submit"
                class="add-btn">

                ➕ Add Product

            </button>


        </form>

    </div>

</main>


<!-- ================= FOOTER ================= -->

<footer>

    <p>
        © 2026 Zenvora — E-Commerce Management System
    </p>

    <p>
        Product Management
    </p>

</footer>


</body>

</html>
