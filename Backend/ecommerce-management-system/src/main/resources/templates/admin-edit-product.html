<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Zenvora - Edit Product</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #F7F5EF;
            color: #1F2933;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            height: 70px;
            background: #0F3D3E;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 50px;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .back-btn {
            text-decoration: none;
            color: white;
            background: #D4A017;

            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #B8860B;
        }

        /* ================= MAIN ================= */

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 0 20px;
        }

        /* ================= FORM ================= */

        .form-box {
            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 5px 18px rgba(0,0,0,0.08);
        }

        .title {
            color: #0F3D3E;

            font-size: 30px;

            margin-bottom: 30px;

            text-align: center;
        }

        .product-id {
            text-align: center;

            color: #777;

            margin-bottom: 25px;
        }

        /* ================= FORM GROUP ================= */

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #0F3D3E;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #D1D5DB;

            border-radius: 8px;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            border-color: #0F3D3E;

            box-shadow:
                0 0 0 2px rgba(15,61,62,0.1);
        }

        /* ================= BUTTONS ================= */

        .buttons {
            display: flex;

            gap: 12px;

            margin-top: 30px;
        }

        .update-btn {
            flex: 1;

            border: none;

            padding: 14px;

            border-radius: 8px;

            background: #D4A017;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .update-btn:hover {
            background: #B8860B;
        }

        .cancel-btn {
            flex: 1;

            text-align: center;

            padding: 14px;

            border-radius: 8px;

            background: #0F3D3E;

            color: white;

            text-decoration: none;

            font-weight: bold;
        }

        .cancel-btn:hover {
            background: #092E2F;
        }

        /* ================= FOOTER ================= */

        footer {
            margin-top: 70px;

            background: #0F3D3E;

            color: white;

            text-align: center;

            padding: 30px;
        }

        footer p {
            margin: 6px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            .navbar {
                padding: 0 20px;
            }

            .logo {
                font-size: 21px;
            }

            .form-box {
                padding: 25px;
            }

            .title {
                font-size: 26px;
            }

            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="logo">
            🛒 Zenvora Admin
        </div>

        <a href="/admin/products"
           class="back-btn">

            ← Products

        </a>

    </nav>


    <!-- ================= MAIN ================= -->

    <main class="container">

        <div class="form-box">

            <h1 class="title">
                ✏️ Edit Product
            </h1>


            <div class="product-id">

                Product ID:
                <strong th:text="${product.productId}">
                    1
                </strong>

            </div>


            <!-- ================= UPDATE FORM ================= -->

            <form
                action="/admin/products/update"
                method="post">


                <!-- PRODUCT ID -->

                <input
                    type="hidden"
                    name="productId"
                    th:value="${product.productId}">


                <!-- PRODUCT NAME -->

                <div class="form-group">

                    <label for="productName">

                        Product Name

                    </label>

                    <input
                        type="text"
                        id="productName"
                        name="productName"
                        th:value="${product.productName}"
                        required>

                </div>


                <!-- PRICE -->

                <div class="form-group">

                    <label for="price">

                        Price (₹)

                    </label>

                    <input
                        type="number"
                        id="price"
                        name="price"
                        step="0.01"
                        min="0"
                        th:value="${product.price}"
                        required>

                </div>


                <!-- QUANTITY -->

                <div class="form-group">

                    <label for="quantity">

                        Stock Quantity

                    </label>

                    <input
                        type="number"
                        id="quantity"
                        name="quantity"
                        min="0"
                        th:value="${product.quantity}"
                        required>

                </div>


                <!-- CATEGORY -->

                <div class="form-group">

                    <label for="categoryId">

                        Category ID

                    </label>

                    <input
                        type="number"
                        id="categoryId"
                        name="categoryId"
                        min="1"
                        th:value="${product.categoryId}"
                        required>

                </div>


                <!-- BUTTONS -->

                <div class="buttons">

                    <button
                        type="submit"
                        class="update-btn">

                        💾 Update Product

                    </button>


                    <a
                        href="/admin/products"
                        class="cancel-btn">

                        Cancel

                    </a>

                </div>


            </form>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026 Zenvora — E-Commerce Management System
        </p>

        <p>
            Product Management
        </p>

    </footer>


</body>

</html>
