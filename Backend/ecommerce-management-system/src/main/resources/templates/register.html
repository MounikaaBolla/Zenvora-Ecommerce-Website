<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zenvora - Create Account</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #dbeafe, #f5f6fa);
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR */

        .navbar {
            height: 70px;
            background: #111827;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 60px;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            background: #2563eb;

            padding: 10px 18px;
            border-radius: 8px;
        }

        .back-btn:hover {
            background: #1d4ed8;
        }

        /* REGISTER */

        .register-section {
            flex: 1;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 50px 20px;
        }

        .register-card {
            width: 100%;
            max-width: 500px;

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
        }

        .register-title {
            text-align: center;
            font-size: 32px;
            color: #111827;

            margin-bottom: 8px;
        }

        .register-subtitle {
            text-align: center;
            color: #6b7280;

            margin-bottom: 30px;
        }

        /* FORM */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;
            color: #374151;
        }

        .form-group input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d1d5db;
            border-radius: 7px;

            font-size: 15px;

            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;

            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        /* BUTTON */

        .register-btn {
            width: 100%;

            border: none;

            background: #2563eb;
            color: white;

            padding: 14px;

            border-radius: 7px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .register-btn:hover {
            background: #1d4ed8;
        }

        /* LOGIN LINK */

        .login-link {
            text-align: center;

            margin-top: 22px;

            color: #6b7280;
        }

        .login-link a {
            color: #2563eb;

            text-decoration: none;

            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* ERROR */

        .error {
            background: #fee2e2;
            color: #b91c1c;

            padding: 12px;

            border-radius: 7px;

            margin-bottom: 20px;

            text-align: center;
        }

        /* FOOTER */

        footer {
            background: #111827;
            color: white;

            text-align: center;

            padding: 25px;
        }

        footer p {
            margin: 5px;
        }

        /* RESPONSIVE */

        @media (max-width: 600px) {

            .navbar {
                padding: 0 20px;
            }

            .logo {
                font-size: 22px;
            }

            .register-card {
                padding: 30px 20px;
            }

            .register-title {
                font-size: 28px;
            }

        }

    </style>

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            🛒 Zenvora
        </div>

        <a href="/products" class="back-btn">
            ← Back to Shop
        </a>

    </nav>


    <!-- REGISTER SECTION -->

    <section class="register-section">

        <div class="register-card">

            <h1 class="register-title">
                Create Account
            </h1>

            <p class="register-subtitle">
                Join Zenvora and start shopping today
            </p>


            <!-- ERROR MESSAGE -->

            <div class="error"
                 th:if="${error}"
                 th:text="${error}">
            </div>


            <!-- REGISTER FORM -->

            <form action="/register" method="post">

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required>

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required>

                </div>


                <button
                    type="submit"
                    class="register-btn">

                    Create Account

                </button>

            </form>


            <div class="login-link">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </div>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 Zenvora — E-Commerce Management System
        </p>

        <p>
            Created by <strong>Ms. Mounika Bolla</strong>
        </p>

    </footer>

</body>

</html>
